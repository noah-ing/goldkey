name: GoldKey Guard founding pilot
description: Apply for a scoped, paid enforcement integration pilot.
title: "[Guard pilot] "
body:
  - type: markdown
    attributes:
      value: |
        GoldKey Guard founding pilots are **$1,000** for one environment, one connector, one immutable operator policy, and up to two hours of integration support. Successful authorization decisions are billed at **$0.05 for MCP/HTTPS** or **$0.10 for EVM** through x402 on Base. ALLOW, REVIEW, and BLOCK decisions are billable; exact unexpired replays are not.

        This issue is public. Do not include credentials, private keys, wallet seed phrases, confidential payloads, customer data, internal URLs, or proprietary policy contents.
  - type: dropdown
    id: connector
    attributes:
      label: Connector type
      description: Choose the first execution path you want to enforce.
      options:
        - MCP tool call
        - HTTPS request
        - EVM transaction
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: A non-secret description such as staging, production canary, or one isolated agent.
      placeholder: Production canary for one routing agent
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Action that must be enforced
      description: Describe the proposed action, the irreversible failure you need to prevent, and how the local enforcer will be the exclusive path. Do not paste real requests or secrets.
      placeholder: Prevent unapproved external seller calls before our router forwards credentials or signs a payment.
    validations:
      required: true
  - type: input
    id: volume
    attributes:
      label: Expected monthly authorizations
      placeholder: 10,000
    validations:
      required: true
  - type: dropdown
    id: timeline
    attributes:
      label: Integration timeline
      options:
        - Within 7 days
        - Within 30 days
        - More than 30 days
    validations:
      required: true
  - type: checkboxes
    id: commercial
    attributes:
      label: Commercial fit
      options:
        - label: I understand the $1,000 pilot fee and metered authorization pricing stated above.
          required: true
        - label: I can run the local enforcer as the exclusive path to the protected credential, connector, or signer.
          required: true
