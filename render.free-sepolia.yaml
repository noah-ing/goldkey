services:
  - type: web
    name: goldkey-api-free
    runtime: docker
    plan: free
    region: ohio
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /readyz
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: PUBLIC_ORIGIN
        value: "https://goldkey-edge-sepolia.noah-ing.workers.dev"
      - key: CHAIN_ID
        value: "84532"
      - key: RPC_URL
        sync: false
      - key: GOLDKEY_CONTRACT
        value: "0x220FE98C77CE79baa00d47C5896BE05C2A7D3db0"
      - key: USDC_ADDRESS
        value: "0x036CbD53842c5426634e7929541eC2318f3dCF7e"
      - key: TREASURY_ADDRESS
        value: "0xd6b7E00FcD46966676F554fE0455BfF739e85b1b"
      - key: X402_ENABLED
        value: "true"
      - key: X402_FACILITATOR_URL
        value: "https://x402.org/facilitator"
      - key: DEV_AUTH_BYPASS
        value: "false"
